version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
    command: >
      sh -c "uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: careerpath
      POSTGRES_PASSWORD: careerpath
      POSTGRES_DB: careerpath
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: